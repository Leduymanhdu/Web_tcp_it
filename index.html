<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký thành viên CLB Yêu Nhạc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ĐĂNG KÝ THÀNH VIÊN CLB YÊU NHẠC</h1>
        
        <div class="form-container">
            <form id="registrationForm">
                <table>
                    <tbody>
                        <!-- Họ tên -->
                        <tr>
                            <td class="label">Họ tên</td>
                            <td class="input-cell">
                                <input type="text" name="fullName" class="text-input" value="Nguyễn Văn Tèo">
                            </td>
                        </tr>
                        
                        <!-- Tên đăng nhập -->
                        <tr>
                            <td class="label">Tên đăng nhập</td>
                            <td class="input-cell">
                                <input type="text" name="username" class="text-input" value="teonv">
                            </td>
                        </tr>
                        
                        <!-- Mật khẩu -->
                        <tr>
                            <td class="label">Mật khẩu</td>
                            <td class="input-cell">
                                <input type="password" name="password" class="text-input" value="******">
                            </td>
                        </tr>
                        
                        <!-- Gõ lại mật khẩu -->
                        <tr>
                            <td class="label">Gõ lại mật khẩu</td>
                            <td class="input-cell">
                                <input type="password" name="confirmPassword" class="text-input" value="******">
                            </td>
                        </tr>
                        
                        <!-- Phái -->
                        <tr>
                            <td class="label">Phái</td>
                            <td class="input-cell radio-group">
                                <label>
                                    <input type="radio" name="gender" value="Nam" checked>
                                    <span>Nam</span>
                                </label>
                                <label>
                                    <input type="radio" name="gender" value="Nữ">
                                    <span>Nữ</span>
                                </label>
                            </td>
                        </tr>
                        
                        <!-- Ngoại ngữ -->
                        <tr>
                            <td class="label">Ngoại ngữ</td>
                            <td class="input-cell checkbox-group">
                                <label>
                                    <input type="checkbox" name="languages" value="Anh" checked>
                                    <span>Anh</span>
                                </label>
                                <label>
                                    <input type="checkbox" name="languages" value="Pháp">
                                    <span>Pháp</span>
                                </label>
                                <label>
                                    <input type="checkbox" name="languages" value="Hoa">
                                    <span>Hoa</span>
                                </label>
                            </td>
                        </tr>
                        
                        <!-- Nghề nghiệp -->
                        <tr>
                            <td class="label">Nghề nghiệp</td>
                            <td class="input-cell">
                                <select name="occupation" class="select-input">
                                    <option value="Học sinh-Sinh viên" selected>Học sinh-Sinh viên</option>
                                    <option value="Giáo viên">Giáo viên</option>
                                    <option value="Kỹ sư">Kỹ sư</option>
                                    <option value="Khác">Khác</option>
                                </select>
                            </td>
                        </tr>
                        
                        <!-- Hình -->
                        <tr>
                            <td class="label">Hình</td>
                            <td class="input-cell file-input-container">
                                <input type="text" class="file-text" readonly >
                                <input type="file" id="imageUpload" name="image" class="hidden-file-input">
                                <button type="button" class="browse-button" onclick="document.getElementById('imageUpload').click()">Browse...</button>
                            </td>
                        </tr>
                        
                        <!-- Sở thích -->
                        <tr>
                            <td class="label">Sở thích</td>
                            <td class="input-cell">
                                <textarea name="interests" class="text-input textarea">Ngắm trăng, uống trà, nuôi thú, nhìn mưa rơi, nghe chim hót, ngâm thơ</textarea>
                            </td>
                        </tr>
                    </tbody>
                </table>
                
                <!-- Action Buttons -->
                <div class="button-container">
                    <button type="submit" class="action-button">Đăng ký</button>
                    <button type="reset" class="action-button">Làm lại</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        // Handle file input display
        document.getElementById('imageUpload').addEventListener('change', function() {
            if (this.files && this.files.length > 0) {
                document.querySelector('.file-text').value = this.files[0].name;
            }
        });

        // Form submission handler
        document.getElementById('registrationForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            // Get form data
            const formData = new FormData(this);
            const userData = {
                fullName: formData.get('fullName'),
                username: formData.get('username'),
                password: formData.get('password'),
                confirmPassword: formData.get('confirmPassword'),
                gender: formData.get('gender'),
                languages: formData.getAll('languages'),
                occupation: formData.get('occupation'),
                interests: formData.get('interests'),
                imagePath: document.querySelector('.file-text').value
            };
            
            // Basic validation
            if (!userData.fullName || !userData.username || !userData.password || !userData.confirmPassword) {
                alert('Vui lòng điền đầy đủ thông tin!');
                return;
            }
            
            if (userData.password !== userData.confirmPassword) {
                alert('Mật khẩu không khớp!');
                return;
            }

            // Make API request to server
            fetch('/api/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(userData),
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Đăng ký thành công!');
                } else {
                    alert('Đăng ký thất bại: ' + (data.message || 'Lỗi không xác định'));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Có lỗi xảy ra khi đăng ký!');
            });
        });
    </script>
</body>
</html>
